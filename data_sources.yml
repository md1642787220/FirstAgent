# ==================== 分块配置 ====================
chunking:
  chunk_size: 500           # 每个文本块最大字符数
  chunk_overlap: 50         # 相邻块重叠字符数
  separators:
    - "\n\n"                # 优先在段落边界分割
    - "\n"                  # 其次在行边界
    - "。"                  # 句子边界（中文）
    - "."                   # 句子边界（英文）
    - "；"                  # 分号
    - " "
    - ""                    # 最后按字符硬分割

# ==================== 检索配置 ====================
retrieval:
  vector_top_k: 5           # 向量语义检索返回候选数
  bm25_top_k: 5             # BM25关键词检索返回候选数
  final_top_k: 3            # RRF融合后最终返回结果数
  rrf_k: 60                 # RRF平滑常数
  similarity_threshold: 0.7 # 相似度阈值，低于此值的结果丢弃
  max_tokens_context: 3000  # 注入Prompt的上下文最大Token数
