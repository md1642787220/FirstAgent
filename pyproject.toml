[project]
name = "welding-ai-agent"
version = "0.1.0"
description = "焊接设备 AI Agent 综合管理平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ==================== 核心框架 ====================
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",
    # ==================== 模型接口 ====================
    "langchain-openai>=0.1.17",
    "langchain-community>=0.2.10",
    # ==================== 向量数据库与检索 ====================
    "chromadb",
    "faiss-cpu",
    "rank_bm25",
    "tiktoken",
    "jieba>=0.42.1",  # 中文分词，用于BM25关键词检索优化
    # ==================== 本地Embedding模型（sentence_transformers）====================
    "sentence-transformers>=2.2.0",      # 核心库：加载BGE/Cross-Encoder等模型
    "langchain-huggingface>=0.0.3",      # LangChain集成：HuggingFaceEmbeddings封装
    # ==================== Web 服务 ====================
    "fastapi",
    "uvicorn>=0.26.0",
    "sse-starlette>=2.1.3,<3.4.0",
    "python-multipart",
    # ==================== 数据处理 ====================
    "sqlalchemy",
    "pandas",
    "numpy",
    # ==================== 文档加载 ====================
    "pypdf",
    "pymupdf",
    "python-docx",
    "openpyxl",
    # ==================== Qt 界面 ====================
    # PySide6 从 6.3.0 起会自动依赖 pyside6-essentials
    "PySide6>=6.0",
    # ==================== 多源数据加载 ====================
    "python-pptx>=0.6.21",
    "xlrd>=2.0.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdown>=3.5.0",
    "extract-msg>=0.47.0",
    "Jinja2>=3.1.2",
    "jsonpath-ng>=1.6.0",
    # ==================== 工具库 ====================
    "python-dotenv>=1.0.0",
    "requests",
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "orjson>=3.9.7",
    "pydantic>=2.0",
    # 测试
    "pytest>=8.0",
    "langchain-chroma>=1.1.0",
]

# 可选依赖分组：按需安装，例如 uv sync --extra db-mysql
[project.optional-dependencies]
db-mysql = ["pymysql>=1.1.0"]
db-postgres = ["psycopg2-binary>=2.9.9"]
db-sqlserver = ["pyodbc>=5.0.0"]
db-oracle = ["cx-Oracle>=8.3.0"]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[tool.uv]
# 本项目是可运行应用，不是要发布到 PyPI 的库
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
